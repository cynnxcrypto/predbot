name: indices-research
on:
  push:
    branches: ["claude/**"]
    paths: ["research/indices/collect.py", "research/indices/run.txt", ".github/workflows/indices-research.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: run
        run: python research/indices/collect.py $(cat research/indices/run.txt) 2>research/indices/out-stderr.log || true
      - name: commit results
        run: |
          mkdir -p research/indices/out && mv research/indices/out-stderr.log research/indices/out/stderr.log || true
          git config user.name "research-bot"; git config user.email "research-bot@users.noreply.github.com"
          git add research/indices/out
          git commit -m "indices research data [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
