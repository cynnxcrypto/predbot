name: politics-study
on:
  push:
    branches: ["claude/**"]
    paths: ["survey/pol_study.py", "survey/pol_run.txt", ".github/workflows/pol-study.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: "pol-${{ github.ref }}-${{ github.sha }}", cancel-in-progress: false }
jobs:
  study:
    strategy: { matrix: { part: [main, xvenue] }, fail-fast: false }
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: run
        run: |
          if [ "${{ matrix.part }}" = main ]; then python survey/pol_study.py $(cat survey/pol_run.txt 2>/dev/null || echo land hist calib fed); else python survey/pol_study.py xvenue; fi 2>survey/pol_out/stderr-${{ matrix.part }}.log || true
      - name: commit results
        run: |
          git config user.name "survey-bot"; git config user.email "survey-bot@users.noreply.github.com"
          git add survey/pol_out
          git commit -m "politics study results (${{ matrix.part }}) [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i*7)); done
